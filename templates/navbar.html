<!-- Navbar Styling -->
<style>
  .navbar-nav .nav-link:hover {
    color: #90EE90 !important;
    border-bottom: 2px solid #90EE90;
    transition: all 0.3s ease;
  }

  .navbar-nav .nav-link.active {
    color: #90EE90 !important;
    border-bottom: 3px solid #90EE90;
  }

      margin: 0.5rem 0;

<!-- Navbar Script for Active Link Highlighting -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
    
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath || (href === '/' && currentPath === '/')) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    // Update status indicator
    fetch('/api/health')
      .then(response => response.json())
      .then(data => {
        const indicator = document.getElementById('status-indicator');
        if (data.status === 'healthy') {
          indicator.textContent = 'Active';
          indicator.parentElement.className = 'badge bg-success';
        } else {
          indicator.textContent = 'Alert';
          indicator.parentElement.className = 'badge bg-warning';
        }
      })
      .catch(() => {
        const indicator = document.getElementById('status-indicator');
        indicator.textContent = 'Offline';
        indicator.parentElement.className = 'badge bg-danger';
      });
  });
</script>
