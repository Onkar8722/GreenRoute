<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Tracking - GreenRoute</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f1419; color: #e0e0e0; }
        .header { background: linear-gradient(135deg, #ff6b6b 0%, #ff8c8c 100%); color: white; padding: 20px 40px; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; padding: 20px; max-width: 2000px; margin: 0 auto; }
        .panel { background: #1a1f2e; border: 1px solid #2a3f5f; border-radius: 8px; padding: 20px; }
        #map { height: 600px; border-radius: 8px; }
        .vehicle-panel { display: flex; flex-direction: column; gap: 15px; }
        .vehicle-card { background: #252d3a; padding: 15px; border-radius: 6px; border-left: 4px solid #ff6b6b; cursor: pointer; transition: all 0.2s; }
        .vehicle-card:hover { background: #2a334a; }
        .vehicle-card.active { border-left-color: #4ecdc4; background: #273344; }
        .vehicle-name { font-weight: 600; color: #ff8c8c; margin-bottom: 8px; }
        .stat-row { display: flex; justify-content: space-between; font-size: 12px; color: #a0a0a0; margin: 4px 0; }
        .progress-bar { height: 6px; background: #2a3f5f; border-radius: 3px; overflow: hidden; margin: 8px 0; }
        .progress { height: 100%; background: linear-gradient(90deg, #4ecdc4, #45b7d1); }
        .stats-grid { display: grid; grid-template-columns: 2; gap: 10px; margin-top: 10px; }
        .stat-box { background: #1a1f2e; padding: 10px; border-radius: 4px; text-align: center; border: 1px solid #2a3f5f; }
        .stat-val { font-size: 16px; font-weight: 600; color: #4ecdc4; }
        .stat-lbl { font-size: 11px; color: #a0a0a0; }
        .btn { padding: 8px 12px; background: #4ecdc4; color: #0f1419; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<!-- Navigation Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" style="background: linear-gradient(135deg, #1a472a 0%, #0d6e3f 100%) !important;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/" style="font-size: 1.3rem; color: #90EE90;">
      <span style="color: #fff;">🌱 Green</span><span style="color: #90EE90;">Route</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-chart-line"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/fleet"><i class="fas fa-truck"></i> Fleet</a></li>
        <li class="nav-item"><a class="nav-link active" href="/tracking"><i class="fas fa-location-dot"></i> Tracking</a></li>
        <li class="nav-item"><a class="nav-link" href="/routes"><i class="fas fa-route"></i> Routes</a></li>
        <li class="nav-item"><a class="nav-link" href="/scenarios"><i class="fas fa-chart-bar"></i> Scenarios</a></li>
        <li class="nav-item"><a class="nav-link" href="/driver"><i class="fas fa-user-tie"></i> Driver</a></li>
        <li class="nav-item ms-3"><span class="badge bg-success"><i class="fas fa-circle"></i> Active</span></li>
      </ul>
    </div>
  </div>
</nav>

    <div class="header">
        <h1><i class="fas fa-map-marker-alt"></i> Real-Time Vehicle Tracking</h1>
    </div>

    <div class="container">
        <div class="panel">
            <div id="map"></div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn" onclick="autoZoom;">📍 Fit All</button>
                <button class="btn" onclick="centerMode();">🎯 Reset Center</button>
                <button class="btn" onclick="toggleTracking();">🔴 Live Tracking</button>
            </div>
        </div>

        <div class="vehicle-panel">
            <h3 style="color: #4ecdc4; margin-bottom: 10px;">Active Vehicles (<span id="activeCount">0</span>)</h3>
            <div id="vehiclesList" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 600px;"></div>
        </div>
    </div>

    <script>
        let map;
        let vehicleMarkers = {};
        let vehicleLines = {};
        let liveTrackingActive = true;
        let selectedVehicle = null;

        function initMap() {
            map = L.map('map').setView([18.5204, 73.8567], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);
        }

        async function updateVehicles() {
            try {
                const res = await fetch('/api/fleet/active-vehicles');
                const data = await res.json();
                
                document.getElementById('activeCount').textContent = data.count;
                
                const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9a825', '#98d8c8'];
                let vehicleHtml = '';
                
                data.vehicles.forEach((v, idx) => {
                    const color = colors[idx % colors.length];
                    const isSelected = selectedVehicle === v.assignment_id;
                    
                    // Update or create marker
                    if (vehicleMarkers[v.assignment_id]) {
                        vehicleMarkers[v.assignment_id].setLatLng([v.latitude, v.longitude]);
                    } else {
                        const marker = L.circleMarker([v.latitude, v.longitude], {
                            radius: 12,
                            fillColor: color,
                            color: 'white',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup(`
                            <b>${v.driver}</b><br>
                            ${v.license_plate}<br>
                            Status: ${v.status}
                        `);
                        
                        marker.on('click', () => selectVehicle(v.assignment_id));
                        vehicleMarkers[v.assignment_id] = marker;
                    }
                    
                    vehicleHtml += `
                        <div class="vehicle-card ${isSelected ? 'active' : ''}" onclick="selectVehicle('${v.assignment_id}')">
                            <div class="vehicle-name" style="color: ${color};">${v.driver}</div>
                            <div class="stat-row">
                                <span>Vehicle:</span>
                                <strong>${v.license_plate}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Type:</span>
                                <strong>${v.vehicle_type}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Current Bin:</span>
                                <strong>${v.current_bin || 'Moving'}</strong>
                            </div>
                            <div class="stat-row">
                                <span>Last Update:</span>
                                <strong>${new Date(v.last_update).toLocaleTimeString()}</strong>
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('vehiclesList').innerHTML = vehicleHtml || '<p style="color: #a0a0a0;">No active vehicles</p>';
                
            } catch(e) {
                console.error('Error:', e);
            }
        }

        async function selectVehicle(assignmentId) {
            selectedVehicle = assignmentId;
            
            try {
                const res = await fetch(`/api/fleet/progress/${assignmentId}`);
                const data = await res.json();
                
                // Update selection
                document.querySelectorAll('.vehicle-card').forEach(card => {
                    card.classList.remove('active');
                });
                event.target.closest('.vehicle-card').classList.add('active');
                
                // Zoom to vehicle
                const vehicle = vehicleMarkers[assignmentId];
                if (vehicle) {
                    map.setView(vehicle.getLatLng(), 15);
                }
                
            } catch(e) {
                console.error('Error:', e);
            }
        }

        function autoZoom() {
            const group = new L.featureGroup(Object.values(vehicleMarkers));
            if (group.getLayers().length > 0) {
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        function centerMode() {
            map.setView([18.5204, 73.8567], 12);
        }

        function toggleTracking() {
            liveTrackingActive = !liveTrackingActive;
            document.querySelector('.btn:nth-child(3)').textContent = liveTrackingActive ? '🔴 Live Tracking' : '⚫ Live Tracking Off';
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            updateVehicles();
            setInterval(() => {
                if (liveTrackingActive) updateVehicles();
            }, 3000);
        });
    </script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Navbar Active Link Script -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath || (href === '/' && currentPath === '/')) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  });
</script>

<!-- Navbar Styling -->
<style>
  .navbar-nav .nav-link {
    color: #fff !important;
    transition: 0.3s;
  }
  
  .navbar-nav .nav-link:hover {
    color: #90EE90 !important;
    border-bottom: 2px solid #90EE90;
  }
  
  .navbar-nav .nav-link.active {
    color: #90EE90 !important;
    border-bottom: 3px solid #90EE90;
  }
  
  @media (max-width: 768px) {
    .navbar-nav .nav-link {
      padding: 0.5rem 0 !important;
      margin: 0.5rem 0;
    }
  }
</style>
</body>
</html>
