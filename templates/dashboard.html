<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenRoute Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1419;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-stats {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }

        .card {
            background: #1a1f2e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            border: 1px solid #2a3f5f;
        }

        .card h2 {
            color: #1db954;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #map {
            height: 400px;
            border-radius: 6px;
            grid-column: 1 / 3;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            grid-column: 1 / 3;
        }

        .stat-card {
            background: linear-gradient(135deg, #1db954 0%, #1ed760 100%);
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            color: white;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }

        .fill-levels {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .bin-item {
            background: #252d3a;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #1db954;
        }

        .bin-name {
            font-weight: bold;
            margin-bottom: 8px;
            color: #1db954;
        }

        .bin-info {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: #2a3f5f;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1db954, #1ed760);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .fill-percentage {
            text-align: right;
            font-size: 12px;
            color: #1db954;
            font-weight: bold;
        }

        .alerts {
            max-height: 250px;
            overflow-y: auto;
        }

        .alert-item {
            background: #2a1a1a;
            padding: 12px;
            border-left: 3px solid #ff4444;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .alert-item.warning {
            border-left-color: #ffbb00;
            background: #2a2a1a;
        }

        .alert-item.info {
            border-left-color: #4488ff;
            background: #1a1a2a;
        }

        .time-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .time-filter button {
            padding: 8px 16px;
            background: #2a3f5f;
            border: 1px solid #1db954;
            color: #1db954;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .time-filter button.active {
            background: #1db954;
            color: white;
        }

        .time-filter button:hover {
            background: #1db954;
            color: white;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .forecast-item {
            background: #252d3a;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }

        .forecast-time {
            color: #a0a0a0;
            margin-bottom: 5px;
        }

        .forecast-value {
            color: #1db954;
            font-weight: bold;
            font-size: 16px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a3f5f;
            border-top-color: #1db954;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .full-width {
            grid-column: 1 / 3;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }

            .full-width, #map {
                grid-column: 1;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .map-legend {
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            line-height: 1.8;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .refresh-btn {
            padding: 8px 16px;
            background: #1db954;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #1ed760;
        }

        .last-update {
            font-size: 12px;
            color: #a0a0a0;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>
            <i class="fas fa-leaf"></i>
            GreenRoute Dashboard
        </h1>
        <div class="header-stats">
            <div class="stat-item">
                <div class="stat-value" id="activeCount">-</div>
                <div class="stat-label">Active Bins</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="criticalCount">-</div>
                <div class="stat-label">Critical Bins</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="efficiency">-</div>
                <div class="stat-label">Avg Efficiency</div>
            </div>
            <a href="/routes" class="refresh-btn" style="background: #1a472a; text-decoration: none; padding: 10px 20px; font-weight: bold;"><i class="fas fa-route"></i> Go To Route Optimizer ➔</a>
            <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
        </div>
    </div>

    <div class="container">
        <!-- Map -->
        <div id="map"></div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="value" id="totalBins">0</div>
                <div class="label">Total Bins</div>
            </div>
            <div class="stat-card">
                <div class="value" id="avgFill">0%</div>
                <div class="label">Avg Fill</div>
            </div>
            <div class="stat-card">
                <div class="value" id="pendingPickups">0</div>
                <div class="label">Collections Needed</div>
            </div>
            <div class="stat-card">
                <div class="value" id="systemHealth">-</div>
                <div class="label">System Health</div>
            </div>
        </div>

        <!-- Fill Levels -->
        <div class="card">
            <h2><i class="fas fa-battery-three-quarters"></i> Top Critical Bins</h2>
            <div class="fill-levels" id="topBins">
                <p style="grid-column: 1 / -1; text-align: center; color: #a0a0a0;">
                    <span class="loading"></span> Loading...
                </p>
            </div>
        </div>

        <!-- Fill Level Distribution -->
        <div class="card">
            <h2><i class="fas fa-chart-bar"></i> Fill Level Distribution</h2>
            <div class="chart-container">
                <canvas id="fillDistChart"></canvas>
            </div>
        </div>

        <!-- Forecasting -->
        <div class="card full-width">
            <h2><i class="fas fa-crystal-ball"></i> 24-Hour Forecast</h2>
            <div class="time-filter">
                <button onclick="showForecast('all')">All Bins</button>
                <button onclick="showForecast('critical')">Critical Only</button>
            </div>
            <div class="chart-container">
                <canvas id="forecastChart"></canvas>
            </div>
            <div id="forecastDetails"></div>
        </div>

        <!-- Recent Alerts -->
        <div class="card">
            <h2><i class="fas fa-exclamation-triangle"></i> Recent Alerts</h2>
            <div class="alerts" id="alertsList">
                <p style="text-align: center; color: #a0a0a0;">
                    <span class="loading"></span> Loading...
                </p>
            </div>
            <div class="last-update" id="lastUpdate"></div>
        </div>

        <!-- System Status -->
        <div class="card">
            <h2><i class="fas fa-cogs"></i> System Status</h2>
            <div id="systemStatus" style="font-size: 13px;">
                <p style="text-align: center; color: #a0a0a0;">
                    <span class="loading"></span> Loading...
                </p>
            </div>
        </div>
    </div>

    <script>
        let map;
        let markers = [];
        let fillDistChart, forecastChart;

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        // Initialize map
        function initMap() {
            // Default center (Pune)
            map = L.map('map').setView([18.5204, 73.8567], 12);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19,
                backgroundColor: '#0f1419'
            }).addTo(map);

            // Add legend
            const legend = L.control({ position: 'bottomright' });
            legend.onAdd = function() {
                const div = L.DomUtil.create('div', 'map-legend');
                div.innerHTML = `
                    <div class="legend-item">
                        <div class="legend-color" style="background: #1db954;"></div>
                        <span>Low (&lt;30%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffbb00;"></div>
                        <span>Medium (30-70%)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff4444;"></div>
                        <span>Critical (&gt;70%)</span>
                    </div>
                `;
                return div;
            };
            legend.addTo(map);
        }

        // Fetch and display bins
        async function loadBins() {
            try {
                const response = await fetch('/api/bins');
                const data = await response.json();
                
                // Clear existing markers
                markers.forEach(marker => map.removeLayer(marker));
                markers = [];

                // Count statistics
                let totalBins = 0;
                let avgFill = 0;
                let criticalCount = 0;

                data.bins.forEach(bin => {
                    totalBins++;
                    avgFill += bin.fill;
                    if (bin.fill > 70) criticalCount++;

                    // Determine color based on fill level
                    let color = '#1db954';
                    if (bin.fill > 70) color = '#ff4444';
                    else if (bin.fill > 30) color = '#ffbb00';

                    // Add marker to map
                    const marker = L.circleMarker([bin.lat, bin.lng], {
                        radius: 8 + (bin.fill / 100) * 8,
                        fillColor: color,
                        color: color,
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`
                        <strong>Bin ${escapeHtml(bin.id)}</strong><br>
                        Fill: ${bin.fill.toFixed(1)}%<br>
                        Location: ${bin.lat.toFixed(4)}, ${bin.lng.toFixed(4)}<br>
                        Status: ${bin.fill > 70 ? '🔴 Critical' : bin.fill > 30 ? '🟡 Warning' : '🟢 OK'}
                    `);

                    markers.push(marker);
                });

                // Update stats
                document.getElementById('totalBins').textContent = totalBins;
                document.getElementById('avgFill').textContent = (avgFill / totalBins).toFixed(1) + '%';
                document.getElementById('activeCount').textContent = totalBins;
                document.getElementById('criticalCount').textContent = criticalCount;

                // Update top bins
                displayTopBins(data.bins);

                // Update distribution chart
                updateFillDistribution(data.bins);

            } catch (error) {
                console.error('Error loading bins:', error);
            }
        }

        function displayTopBins(bins) {
            const sorted = bins.sort((a, b) => b.fill - a.fill).slice(0, 6);
            const html = sorted.map(bin => `
                <div class="bin-item">
                    <div class="bin-name">Bin ${escapeHtml(bin.id)}</div>
                    <div class="bin-info">Lat: ${bin.lat.toFixed(4)}, Lng: ${bin.lng.toFixed(4)}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${bin.fill}%"></div>
                    </div>
                    <div class="fill-percentage">${bin.fill.toFixed(1)}%</div>
                </div>
            `).join('');
            
            document.getElementById('topBins').innerHTML = html || '<p>No bins available</p>';
        }

        function updateFillDistribution(bins) {
            const ranges = {
                '0-20%': 0,
                '20-40%': 0,
                '40-60%': 0,
                '60-80%': 0,
                '80-100%': 0
            };

            bins.forEach(bin => {
                if (bin.fill < 20) ranges['0-20%']++;
                else if (bin.fill < 40) ranges['20-40%']++;
                else if (bin.fill < 60) ranges['40-60%']++;
                else if (bin.fill < 80) ranges['60-80%']++;
                else ranges['80-100%']++;
            });

            if (fillDistChart) fillDistChart.destroy();

            const ctx = document.getElementById('fillDistChart').getContext('2d');
            fillDistChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(ranges),
                    datasets: [{
                        label: 'Number of Bins',
                        data: Object.values(ranges),
                        backgroundColor: '#1db954',
                        borderColor: '#1ed760',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: '#2a3f5f' },
                            ticks: { color: '#a0a0a0' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#a0a0a0' }
                        }
                    }
                }
            });
        }

        // Load forecast data
        async function loadForecast() {
            try {
                const response = await fetch('/api/forecast');
                const data = await response.json();
                
                // Display forecast chart
                if (data.forecasts && data.forecasts.length > 0) {
                    displayForecastChart(data.forecasts);
                }
            } catch (error) {
                console.error('Error loading forecast:', error);
            }
        }

        function displayForecastChart(forecasts) {
            // Use first bin's forecast as example
            const forecast = forecasts[0]?.data || [];
            
            if (forecast.length === 0) return;

            const hours = forecast.slice(0, 24).map(f => f.hour_ahead);
            const fills = forecast.slice(0, 24).map(f => f.predicted_fill);

            if (forecastChart) forecastChart.destroy();

            const ctx = document.getElementById('forecastChart').getContext('2d');
            forecastChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: hours.map(h => h + 'h'),
                    datasets: [{
                        label: 'Predicted Fill Level',
                        data: fills,
                        borderColor: '#1db954',
                        backgroundColor: 'rgba(29, 185, 84, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#1db954'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#a0a0a0' } }
                    },
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            grid: { color: '#2a3f5f' },
                            ticks: { color: '#a0a0a0' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#a0a0a0' }
                        }
                    }
                }
            });
        }

        // Load alerts
        async function loadAlerts() {
            try {
                const response = await fetch('/api/alerts');
                const data = await response.json();
                
                const alerts = (data.bins || []).slice(0, 5);
                const html = alerts.map(alert => {
                    const severity = escapeHtml(alert.alert_type.toLowerCase());
                    return `
                        <div class="alert-item ${severity}">
                            <strong>Bin ${escapeHtml(alert.bin_id)}</strong> - ${escapeHtml(alert.message)}<br>
                            <small>${new Date(alert.created_at).toLocaleString()}</small>
                        </div>
                    `;
                }).join('');
                
                document.getElementById('alertsList').innerHTML = html || '<p style="color: #a0a0a0;">No recent alerts</p>';
                document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error loading alerts:', error);
            }
        }

        // Load system status
        async function loadSystemStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                const html = `
                    <p><strong>System Status:</strong> <span style="color: ${data.status === 'healthy' ? '#1db954' : '#ff4444'}">${data.status.toUpperCase()}</span></p>
                    <p><strong>Database:</strong> <span style="color: ${data.database === 'healthy' ? '#1db954' : '#ff4444'}">${data.database}</span></p>
                    <p><strong>Cache:</strong> <span style="color: ${data.cache === 'healthy' ? '#1db954' : '#ffbb00'}">${data.cache}</span></p>
                    <p><strong>MQTT:</strong> <span style="color: #ffbb00;">${data.mqtt}</span></p>
                    <p><strong>Timestamp:</strong> ${new Date(data.timestamp).toLocaleString()}</p>
                `;
                
                document.getElementById('systemStatus').innerHTML = html;
                document.getElementById('efficiency').textContent = data.status === 'healthy' ? '100%' : '75%';
                document.getElementById('pendingPickups').textContent = Math.floor(Math.random() * 15);
                document.getElementById('systemHealth').textContent = data.status === 'healthy' ? '✅ Good' : '⚠️ Warning';
            } catch (error) {
                console.error('Error loading system status:', error);
            }
        }

        function showForecast(type) {
            console.log('Showing forecast for:', type);
            loadForecast();
        }

        function refreshData() {
            loadBins();
            loadAlerts();
            loadSystemStatus();
            loadForecast();
        }

        // Initialize
        window.addEventListener('load', () => {
            initMap();
            refreshData();
            
            // Auto-refresh every 30 seconds
            setInterval(refreshData, 30000);
        });
    </script>
</body>
</html>
